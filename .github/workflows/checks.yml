name: Checks

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and release files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11' # the Python used by Kodi 21
      - name: Compile all the Python files
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m compileall -q -f default.py service.py resources .github/scripts
      - name: Modules of Kodi's repository used by the tests (catalog refresh outside Kodi)
        run: pip install beautifulsoup4 unidecode
      - name: Unit tests (models, user data)
        run: python -m unittest discover -s tests -v
      - name: Check version, changelog, md5 and tracked files
        run: python .github/scripts/check_release.py

  python-kodi22:
    name: Python 3.14 (Kodi 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14' # the Python of Kodi 22
      - name: Compile all the Python files
        run: python -W error::SyntaxWarning -W error::DeprecationWarning -m compileall -q -f default.py service.py resources .github/scripts
      - name: Modules of Kodi's repository used by the tests (catalog refresh outside Kodi)
        run: pip install beautifulsoup4 unidecode
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  addon-checker:
    name: kodi-addon-checker
    runs-on: ubuntu-latest
    env:
      # no problem allowed (the 78 of the 1.x baseline are fixed); the warnings are not counted
      MAX_ERRORS: 0
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin.video.gmatv # the checker expects the folder to be named like the add-on id
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install kodi-addon-checker==0.0.36
      - name: Run kodi-addon-checker (Kodi 21 Omega)
        run: |
          kodi-addon-checker --branch omega plugin.video.gmatv 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee checker.log
          # the summary line ("We found N problems") is an ERROR line only when there are problems
          errors=$(grep '^ERROR: ' checker.log | grep -vc 'We found' || true)
          echo "problems found: $errors (allowed: $MAX_ERRORS)"
          if [ "$errors" -gt "$MAX_ERRORS" ]; then
            echo "::error::kodi-addon-checker found $errors problems, more than the $MAX_ERRORS allowed"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
